name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: pytest -q
      # 규칙 기반 정확도를 로그에 남긴다 (LLM은 키가 필요해서 CI에서는 돌리지 않는다)
      - run: python eval.py
